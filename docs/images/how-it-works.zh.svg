<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img">
<title>cam 原理：Agent 宿主、cam CLI、本地 SQLite</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .h { fill: #0f172a; font-size: 14px; font-weight: 600; }
    .t { fill: #0f172a; font-size: 12px; }
    .s { fill: #64748b; font-size: 11px; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
  </style>
</defs>
<rect width="760" height="500" fill="#ffffff"/>

<rect x="20" y="16" width="720" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="380" y="42" text-anchor="middle" class="sans h">Cursor / Claude Code / …</text>
<rect x="150" y="56" width="460" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="380" y="77" text-anchor="middle" class="sans t">「BM25 和向量的多路召回以前做过吗？」</text>
<rect x="90" y="104" width="260" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="220" y="127" text-anchor="middle" class="sans t"><tspan font-weight="600">主 Agent</tspan>  →  <tspan class="mono">MCP cam_recall</tspan></text>
<rect x="410" y="104" width="260" height="36" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="540" y="127" text-anchor="middle" class="sans t"><tspan font-weight="600">Subagent</tspan>  →  <tspan class="mono">CLI cam recall</tspan></text>

<rect x="20" y="192" width="720" height="160" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="380" y="216" text-anchor="middle" class="sans h">cam CLI</text>
<text x="380" y="232" text-anchor="middle" class="sans s">单个 Rust 二进制 · MCP + CLI</text>

<rect x="50" y="244" width="310" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="205" y="263" text-anchor="middle" class="mono t">ls · read · ref</text>
<rect x="50" y="288" width="310" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="205" y="308" text-anchor="middle" class="sans t" font-weight="600">代码图</text>
<text x="205" y="326" text-anchor="middle" class="sans s">tree-sitter · 调用方 / 被调用方</text>

<rect x="400" y="244" width="310" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="555" y="263" text-anchor="middle" class="mono t">recall · add · mem</text>
<rect x="400" y="288" width="310" height="48" rx="8" fill="#ffedd5" stroke="#ea580c"/>
<text x="555" y="308" text-anchor="middle" class="sans t" font-weight="600">记忆树</text>
<text x="555" y="326" text-anchor="middle" class="sans s">向量 + BM25（FTS5）· RRF 融合</text>

<path d="M220,140 L220,190" class="edge" marker-end="url(#arrow)"/>
<text x="228" y="172" class="mono s">MCP stdio</text>
<path d="M540,140 L540,190" class="edge" marker-end="url(#arrow)"/>
<text x="548" y="172" class="mono s">shell · --json</text>
<path d="M205,272 L205,286" class="edge" marker-end="url(#arrow)"/>
<path d="M555,272 L555,286" class="edge" marker-end="url(#arrow)"/>
<path d="M205,336 L205,390" class="edge" marker-end="url(#arrow)"/>
<path d="M555,336 L555,390" class="edge" marker-end="url(#arrow)"/>

<path d="M180,400 L180,466 A200,14 0 0 0 580,466 L580,400" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<ellipse cx="380" cy="400" rx="200" ry="14" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="380" y="436" text-anchor="middle" class="sans t"><tspan font-weight="600">本地 SQLite</tspan>  <tspan class="mono">.cam/cam.db</tspan></text>
