[package]
name = "cam"
version = "0.1.0"
edition = "2021"
description = "CodeAgent memory: code graph + memory (CLI + MCP)"
license = "MIT"
default-run = "cam"

[lib]
name = "cam"
path = "src/lib.rs"

[[bin]]
name = "cam"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
ignore = "0.4"
jieba-rs = "0.7"
model2vec-rs = "0.1"
notify = "6.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
streaming-iterator = "0.1"
toml = "0.8"
tree-sitter = "0.24"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
