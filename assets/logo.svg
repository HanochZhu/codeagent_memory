<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="memory" x1="28" y1="27" x2="94" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60E6FF"/>
      <stop offset="1" stop-color="#6C7CFF"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#08111F"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="27.25" stroke="#FFFFFF" stroke-opacity=".09" stroke-width="1.5"/>

  <!-- A continuous recall loop shaped like the letter C. -->
  <path d="M89 35C75 23 52 24 37 39C23 53 23 76 37 90C51 104 74 105 89 93"
