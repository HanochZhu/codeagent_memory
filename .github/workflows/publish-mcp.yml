name: Publish MCP image and registry entry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version server.json)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/hanochzhu/codeagent-memory:${version}" >> "$GITHUB_OUTPUT"

      - name: Align server.json with the tag
        run: |
          jq --arg v "${{ steps.ver.outputs.version }}" \
            --arg image "ghcr.io/hanochzhu/codeagent-memory:${{ steps.ver.outputs.version }}" \
            '.version = $v | del(.packages[0].version) | .packages[0].identifier = $image' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}
            ghcr.io/hanochzhu/codeagent-memory:latest
          labels: |
            org.opencontainers.image.source=https://github.com/HanochZhu/codeagent_memory
            org.opencontainers.image.licenses=MIT

      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          set -eu
          public() {
            token=$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/codeagent-memory:pull" | jq -r .token)
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${OWNER}/codeagent-memory/manifests/${IMAGE##*:}")
            [ "$code" = "200" ]
          }
          if public; then
            echo "${IMAGE} is already anonymously pullable."
            exit 0
          fi
          code=$(curl -sS -o /tmp/pkg.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${OWNER}/packages/container/codeagent-memory" \
            -d '{"visibility":"public"}')
          echo "visibility status ${code}"
          cat /tmp/pkg.json
          echo
          if public; then
            exit 0
          fi
          echo "Could not make ghcr.io/${OWNER}/codeagent-memory public."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: |
          set -eu
          if ! ./mcp-publisher publish > /tmp/publish.txt 2>&1; then
            echo "::error::$(tr '\n' ' ' < /tmp/publish.txt | cut -c1-800)"
            cat /tmp/publish.txt
            exit 1
          fi
          cat /tmp/publish.txt
