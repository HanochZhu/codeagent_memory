name: Publish MCP image and registry entry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version server.json)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/hanochzhu/codeagent-memory:${version}" >> "$GITHUB_OUTPUT"

      - name: Align server.json with the tag
        run: |
          jq --arg v "${{ steps.ver.outputs.version }}" \
            --arg image "ghcr.io/hanochzhu/codeagent-memory:${{ steps.ver.outputs.version }}" \
            '.version = $v | .packages[0].version = $v | .packages[0].identifier = $image' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ver.outputs.image }}
            ghcr.io/hanochzhu/codeagent-memory:latest
          labels: |
            org.opencontainers.image.source=https://github.com/HanochZhu/codeagent_memory
            org.opencontainers.image.licenses=MIT

      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/codeagent-memory" \
            -f visibility=public

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
